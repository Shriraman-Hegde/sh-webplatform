name: webkit

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @sh-webplatform/webkit-cli typecheck
      - run: pnpm --filter @sh-webplatform/webkit-cli test
      - name: Install Playwright Chromium
        working-directory: packages/webkit
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @sh-webplatform/webkit lint
      - run: pnpm --filter @sh-webplatform/webkit test
      - run: pnpm --filter @sh-webplatform/webkit build
      - run: pnpm --filter @sh-webplatform/webkit build-storybook
      - run: pnpm --filter sample-consumer test
      - run: pnpm --filter sample-consumer build
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/webkit/storybook-static

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - id: deployment
        uses: actions/deploy-pages@v4
