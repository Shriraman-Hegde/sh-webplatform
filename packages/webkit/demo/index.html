<!doctype html>
<html lang="en" data-theme="default" data-motion="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webkit demo (open-wc / web-dev-server)</title>
    <link rel="stylesheet" href="../src/themes/themes.css" />
    <style>
      body {
        margin: 0;
        font-family: var(--wk-font-sans, system-ui, sans-serif);
        background: var(--wk-bg);
        color: var(--wk-ink);
      }
      .bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--wk-border);
      }
    </style>
    <script type="module">
      import { iconRegistry } from "@sh-webplatform/icons";
      import { bootstrapWebkit } from "../src/bootstrap.ts";
      import "../src/components/composite/wk-workbench/index.ts";

      const boot = () =>
        bootstrapWebkit({
          theme: document.getElementById("theme").value,
          motion: document.getElementById("motion").value,
          icons: document.getElementById("icons").checked
            ? iconRegistry
            : undefined,
        });

      boot();
      document.getElementById("theme").addEventListener("change", boot);
      document.getElementById("motion").addEventListener("change", boot);
      document.getElementById("icons").addEventListener("change", boot);
    </script>
  </head>
  <body>
    <div class="bar">
      <label>
        Theme
        <select id="theme">
          <option value="default">default</option>
          <option value="warm">warm</option>
        </select>
      </label>
      <label>
        Motion
        <select id="motion">
          <option value="system">system</option>
          <option value="on">on</option>
          <option value="off">off</option>
        </select>
      </label>
      <label>
        <input id="icons" type="checkbox" checked />
        Icons library
      </label>
      <span>webkit host boot (optional icons + motion)</span>
    </div>
    <wk-workbench></wk-workbench>
  </body>
</html>
